participants:
  - el_type: geth
    cl_type: prysm
    cl_image: ethpandaops/prysm-beacon-chain:pq-devnet-0-seacast
    vc_image: ethpandaops/prysm-validator:pq-devnet-0-seacast
    cl_extra_params:
      - --enable-segmented-payload-gossip
      - --seacast-uplink-mbps=1000
      - --seacast-payload-only
    count: 2
  - el_type: geth
    cl_type: silver
    cl_image: ethpandaops/silver:pq-devnet-0-seacast
    vc_type: prysm
    vc_image: ethpandaops/prysm-validator:pq-devnet-0-seacast
    count: 2

network_params:
  preset: mainnet
  gloas_fork_epoch: 0
  pq_fork_epoch: 0
  genesis_delay: 120

additional_services:
  - dora
  - prometheus
  - grafana
