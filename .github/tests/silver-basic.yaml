# silver serves no validator duties, so it takes no share of the validator
# set: with a non-zero validator_count its validators would be assigned and
# then never attest, and a two-participant devnet would not finalize.
participants:
  - el_type: geth
    cl_type: silver
    validator_count: 0
  - el_type: geth
    cl_type: lighthouse
network_params:
  preset: mainnet
  fulu_fork_epoch: 0
global_log_level: info
port_publisher:
  cl:
    enabled: true
