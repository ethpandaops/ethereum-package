# EIP-8025 testnet with zkboost backed by GPU (ZisK) provers.
#
#
# Run with:
#   kurtosis run --enclave eip8025-zkboost-8gpu \
#       . \
#       --args-file .github/tests/8gpu_zkvm.yaml_norun
#
# Prerequisites:
#   - NVIDIA GPUs with drivers installed (8 GPUs: 4 per prover type)
#   - NVIDIA Container Toolkit configured for Docker

participants:
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    el_type: reth
    el_image: ethpandaops/reth:glamsterdam-devnet-8-7fddea4
    supernode: true
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_extra_params:
      - --target-peers=3
      - --execution-endpoint=http://zkboost-1:3000
      - --proof-engine
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: None
    supernode: false
    validator_count: 0
    cl_extra_params:
      - --target-peers=3
      - --proof-engine

network_params:
  gloas_fork_epoch: 0
  genesis_delay: 300

additional_services:
  - zkboost
  - dora
  - prometheus
  - grafana
  - tempo
  - assertoor

assertoor_params:
  tests:
    - /tests/zkboost-metrics-test.yaml

zkboost_params:
  image: ghcr.io/eth-act/zkboost/zkboost:0.11.0
  env:
    RUST_LOG: info,zkboost=debug
  instances:
    - name: zkboost-1
  zkvms:
    - kind: ere
      proof_type: reth-zisk
      gpu:
        device_ids: ["0", "1", "2", "3"]
    - kind: ere
      proof_type: ethrex-zisk
      gpu:
        device_ids: ["4", "5", "6", "7"]
