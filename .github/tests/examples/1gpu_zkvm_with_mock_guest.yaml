# EIP-8025 testnet with zkboost backed by a single GPU OpenVM prover of the mock guest.
#
#
# Run with:
#   kurtosis run --enclave eip8025-zkboost-1gpu \
#       . \
#       --args-file .github/tests/examples/1gpu_zkvm_with_mock_guest.yaml
#
# Prerequisites:
#   - NVIDIA GPU with drivers installed
#   - NVIDIA Container Toolkit configured for Docker

participants:
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    el_type: reth
    el_image: ethpandaops/reth:glamsterdam-devnet-8-7fddea4
    supernode: true
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_extra_params:
      - --target-peers=3
      - --execution-endpoint=http://zkboost-1:3000
      - --proof-engine=/config/proof-engine.json
    cl_extra_mounts:
      /config: proof-engine.json
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: None
    supernode: false
    validator_count: 0
    cl_extra_params:
      - --target-peers=3
      - --proof-engine=/config/proof-engine.json
    cl_extra_mounts:
      /config: proof-engine.json

network_params:
  gloas_fork_epoch: 0
  genesis_delay: 300

extra_files:
  proof-engine.json: |
    {
      "execution_proofs": [
        { "proof_type": 1, "program_vk": "" },
        { "proof_type": 4, "program_vk": "" }
      ]
    }

additional_services:
  - zkboost
  - dora
  - prometheus
  - grafana
  - tempo
  - spamoor

spamoor_params:
  spammers:
    - name: "Blob Spammer (Kurtosis Package)"
      scenario: "blobs"
      config:
        throughput: 1
    - name: "ERC txs"
      scenario: "erctx"
      config:
        throughput: 1


zkboost_params:
  image: ghcr.io/eth-act/zkboost/zkboost:0.11.0
  env:
    RUST_LOG: info,zkboost=debug
  instances:
    - name: zkboost-1
  zkvms:
    - kind: ere
      proof_type: reth-openvm
      image: ghcr.io/eth-act/ere/ere-server-openvm:0.17.1-cuda
      elf_url: https://raw.githubusercontent.com/eth-act/zkboost/v0.11.0/docker/example/mock-beacon-node/mock-guest/openvm.elf
      proof_timeout_secs: 60
      gpu:
        device_ids: ["0"]
    - kind: ere
      proof_type: ethrex-openvm
      endpoint: http://ere-server-reth-openvm:3000
      proof_timeout_secs: 60
