participants:
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    supernode: true
    cl_extra_params:
      - --target-peers=3
      - --execution-endpoint=http://zkboost:3000
      - --proof-engine
  - cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:eth-act-optional-proofs
    el_type: reth
    el_image: ethpandaops/reth:glamsterdam-devnet-8-7fddea4
    supernode: false
    cl_extra_params:
      - --target-peers=3
      - --proof-engine

network_params:
  gloas_fork_epoch: 0
  genesis_delay: 300

additional_services:
  - zkboost
  - dora
  - prometheus
  - grafana
  - tempo

zkboost_params:
  image: ghcr.io/eth-act/zkboost/zkboost:0.11.0
